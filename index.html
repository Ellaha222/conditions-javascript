<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Checker</title>
</head>
<body>
     <h1>Student Checker</h1>

    <!-- Task 1: Age Checker -->
    <h2>Age Checker</h2>

    <input type="number" id="age" placeholder="Enter your age">
    <button id="ageButton">Check Age</button>

    <p id="ageResult"></p>


    <!-- Task 2: Number Checker -->
    <h2>Number Checker</h2>

    <input type="number" id="number" placeholder="Enter a number">
    <button id="numberButton">Check Number</button>

    <p id="numberResult"></p>


    <!-- Task 3: Grade Checker -->
    <h2>Grade Checker</h2>

    <input type="number" id="score" placeholder="Enter your score">
    <button id="gradeButton">Check Grade</button>

    <p id="gradeResult"></p>


    <!-- Task 4: Even or Odd -->
    <h2>Even or Odd</h2>

    <input type="number" id="evenOddNumber" placeholder="Enter a number">
    <button id="evenOddButton">Check</button>

    <p id="evenOddResult"></p>


    <!-- Task 5: Login Checker -->
    <h2>Login Checker</h2>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button id="loginButton">Login</button>

    <p id="loginResult"></p>


    <!-- Task 6: Ternary Operator -->
    <h2>Adult or Minor</h2>

    <input type="number" id="ternaryAge" placeholder="Enter your age">
    <button id="ternaryButton">Check</button>

    <p id="ternaryResult"></p>


    <!-- Task 7: Access Checker -->
    <h2>Access Checker</h2>

    <input type="number" id="accessAge" placeholder="Enter your age">

    <label>
        <input type="checkbox" id="hasID">
        I have an ID
    </label>

    <button id="accessButton">Check Access</button>

    <p id="accessResult"></p>


    <!-- Bonus: Student Result Checker -->
    <h2>Student Result Checker</h2>

    <form id="studentForm">

        <input type="text" id="studentName" placeholder="Student name">

        <input type="number" id="studentScore" placeholder="Score">

        <button type="submit">Check Result</button>

    </form>

    <p id="studentResult"></p>


    <script src="script.js"></script>

</body>
</html>
